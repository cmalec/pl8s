<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pl8s settings</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font: 15px/1.45 system-ui, -apple-system, sans-serif;
    background: #0d0f12;
    color: #e8eaed;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #9aa0a6; margin: 0 0 18px; font-size: 13px; }
  section {
    background: #171a1f;
    border: 1px solid #262b33;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: #9aa0a6; margin: 0 0 10px; }
  label { display: block; margin: 0 0 14px; }
  label > span { display: block; margin-bottom: 5px; font-size: 14px; }
  select, input[type=number] {
    width: 100%;
    padding: 9px 10px;
    font-size: 15px;
    background: #0d0f12;
    color: #e8eaed;
    border: 1px solid #333a44;
    border-radius: 8px;
  }
  .plate-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #20242b;
  }
  .plate-row:last-child { border-bottom: 0; }
  .plate-row .disc {
    width: 18px; height: 18px;
    border-radius: 4px;
    flex: 0 0 auto;
  }
  .plate-row span.name { flex: 1 1 auto; font-weight: 600; }
  .plate-row input[type=number] { width: 72px; text-align: center; }
  .hint { color: #9aa0a6; font-size: 12px; margin-top: 4px; }
  .buttons { display: flex; gap: 10px; }
  .buttons button {
    flex: 1;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button.save { background: #3b82f6; color: #fff; }
  button.cancel { background: #262b33; color: #e8eaed; }
</style>
</head>
<body>
  <h1>pl8s</h1>
  <p class="sub">Barbell plate &amp; percentage calculator</p>

  <section>
    <h2>Percentages</h2>
    <label>
      <span>Rows</span>
      <select id="step">
        <option value="10">10% steps - 90 / 80 / 70 / 60 / 50</option>
        <option value="5">5% steps - 90 / 85 / 80 / 75 / 70 / 65 / 60</option>
      </select>
    </label>
    <label>
      <span>Exercise max (lb)</span>
      <input type="number" id="max" min="45" max="995" step="5" value="225">
      <div class="hint">45 - 995 lb, 5 lb steps</div>
    </label>
  </section>

  <section>
    <h2>Plates per side</h2>
    <div id="plates"></div>
    <div class="hint">How many of each plate the gym has: 0-10 per side, or 99 for unlimited (the default).</div>
  </section>

  <div class="buttons">
    <button class="save" id="save">Save</button>
    <button class="cancel" id="cancel">Cancel</button>
  </div>

<script>
  // Size, color, count (0..10 per side, 99 = unlimited).
  var PLATES = [
    { lb: '55',  color: '#e53935' },
    { lb: '45',  color: '#1e6fd9' },
    { lb: '35',  color: '#fdd835' },
    { lb: '25',  color: '#43a047' },
    { lb: '15',  color: '#ec407a' },
    { lb: '10',  color: '#f5f5f5' },
    { lb: '5',   color: '#26c6da' },
    { lb: '2.5', color: '#9e9e9e' }
  ];

  function closeWith(payload) {
    var frag = payload === null ? '' : encodeURIComponent(JSON.stringify(payload));
    location.href = 'pebblejs://close#' + frag;
  }

  // Query params supplied by src/pkjs/index.js (current watch settings):
  // ?step=..&max=..&p55=..&p45=..&p35=..&p25=..&p15=..&p10=..&p5=..&p2p5=..
  function params() {
    var out = {};
    location.search.replace(/^\?/, '').split('&').forEach(function(kv) {
      if (!kv) { return; }
      var i = kv.indexOf('=');
      out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }

  function num(v, dflt) {
    var n = parseInt(v, 10);
    return isNaN(n) ? dflt : n;
  }

  function build() {
    var q = params();
    var wrap = document.getElementById('plates');
    var step = num(q.step, 10);
    document.getElementById('step').value = (step === 5) ? 5 : 10;
    document.getElementById('max').value = q.max ? num(q.max, 225) : 225;
    PLATES.forEach(function(p) {
      var row = document.createElement('div');
      row.className = 'plate-row';

      var disc = document.createElement('span');
      disc.className = 'disc';
      disc.style.background = p.color;

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = p.lb + ' lb';

      var key = 'p' + p.lb.replace('.', 'p');
      var count = q[key] !== undefined ? num(q[key], 99) : 99;

      var input = document.createElement('input');
      input.type = 'number';
      input.min = 0;
      input.max = 99;
      input.step = 1;
      input.value = count;
      input.dataset.lb = p.lb;

      row.appendChild(disc);
      row.appendChild(name);
      row.appendChild(input);
      wrap.appendChild(row);
    });
  }

  document.getElementById('save').addEventListener('click', function() {
    var step = parseInt(document.getElementById('step').value, 10);
    var max = parseInt(document.getElementById('max').value, 10);
    if (isNaN(max) || max < 45 || max > 995) {
      alert('Max must be between 45 and 995 lb');
      return;
    }
    var plates = {};
    var inputs = document.querySelectorAll('#plates input');
    for (var i = 0; i < inputs.length; i++) {
      var v = parseInt(inputs[i].value, 10);
      // Literal counts are 0-10 per side; 99 is the unlimited sentinel.
      if (isNaN(v) || v < 0) { v = 0; }
      else if (v > 10 && v < 99) { v = 10; }
      else if (v > 99) { v = 99; }
      plates[inputs[i].dataset.lb] = v;
    }
    closeWith({ step: step, max: max, plates: plates });
  });

  document.getElementById('cancel').addEventListener('click', function() {
    closeWith(null);
  });

  build();
</script>
</body>
</html>
